name: safety

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Safety scan
        run: ./scripts/safety-scan.sh

      - name: Evidence filename check
        run: ./scripts/check-evidence-names.sh

      - name: Agent layer sync
        run: ./scripts/check-agents-sync.sh

      - name: Shellcheck
        run: shellcheck scripts/*.sh scripts/hooks/*.sh .githooks/pre-commit
